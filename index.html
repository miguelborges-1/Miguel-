<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Ao Vivo</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #00ff88;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .match-card {
            background: var(--surface);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .team {
            font-size: 1.2rem;
            font-weight: 600;
            flex: 1;
        }
        
        .team-away {
            text-align: right;
        }
        
        .score {
            font-size: 1.8rem;
            font-weight: 900;
            padding: 0 20px;
            color: var(--primary);
            letter-spacing: 2px;
        }
        
        .status {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            min-width: 80px;
        }
        
        .live-indicator {
            color: #ff3333;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Futebol em Tempo Real</h1>
        <div id="matches-container">
            <p style="text-align:center; color: var(--text-secondary);">Buscando jogos ao vivo...</p>
        </div>
    </div>

    <script>
        // Simulação da estrutura de dados que uma API real retornaria
        const mockData = [
            { home: "Flamengo", away: "Palmeiras", homeScore: 1, awayScore: 1, time: "67'", isLive: true },
            { home: "São Paulo", away: "Corinthians", homeScore: 0, awayScore: 0, time: "15'", isLive: true },
            { home: "Grêmio", away: "Internacional", homeScore: 2, awayScore: 1, time: "Encerrado", isLive: false }
        ];

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = ''; // Limpa a mensagem de carregamento

            mockData.forEach(match => {
                const statusClass = match.isLive ? 'live-indicator' : '';
                const timeText = match.isLive ? `🔴 ${match.time}` : match.time;
                
                const matchHTML = `
                    <div class="match-card">
                        <div class="team">${match.home}</div>
                        <div class="score">${match.homeScore} - ${match.awayScore}</div>
                        <div class="team team-away">${match.away}</div>
                        <div class="status ${statusClass}">${timeText}</div>
                    </div>
                `;
                container.innerHTML += matchHTML;
            });
        }

        // Simula o tempo de resposta de um servidor (1 segundo)
        setTimeout(renderMatches, 1000);

        }
        
        // Atualiza os dados a cada 60 segundos
        // setInterval(fetchLiveScores, 60000);

    </script>
</body>
</html>
